{% extends "base.html" %}

{% block content %}

<h1>Category: {{ category }}</h1>

<ul>
    {% for course in courses %}
        <li>
            <a href="{% url 'courses:detail' course.slug %}">
                {{ course.title }}
            </a>
        </li>
    {% empty %}
        <li>No courses found.</li>
    {% endfor %}
</ul>

{% endblock %}
