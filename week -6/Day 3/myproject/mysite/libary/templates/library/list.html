{% extends "library/base.html" %}

{% block content %}

<h1>Books</h1>

{% for book in books %}

    <h2>
        <a href="{% url 'book_detail' book.id %}">
            {{ book.title }}
        </a>
    </h2>

    <p>Author: {{ book.author }}</p>
    <p>Year: {{ book.year }}</p>

{% empty %}

    <p>No books found.</p>

{% endfor %}

{% endblock %}
