{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post | TaifGram</title>

    <link rel="stylesheet" href="{% static 'css/feed.css' %}">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            TAIF<span>GRAM</span>
        </div>

        <a href="{% url 'feed:feed' %}" class="new-post">
            ← Feed
        </a>

    </header>


    <main class="create-page">

        <div class="create-card">

            <p class="eyebrow">NEW MISSION</p>

            <h1>Share a moment<br><span>from space.</span></h1>

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="submit-button">
                    Publish Post 🚀
                </button>

            </form>

        </div>

    </main>

</body>

</html>
